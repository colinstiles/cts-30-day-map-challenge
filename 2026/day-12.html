<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 12 — Year 5: the claim and the hold | 30 Day Map Challenge</title>
  <meta name="description" content="Claimed regions of Ukraine, assessed occupation on 6 January 2026, and the ground that changed hands through 12 November 2026.">
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/power.css">
</head>
<body class="power-page">
  <div id="power-map" role="application" aria-label="Time map of assessed control in 2026"></div>

  <header class="power-header" id="power-header">
    <div class="power-header-top">
      <a class="power-back" href="../index.html">← Gallery</a>
    </div>
    <span class="power-kicker">Day 12 · Power</span>
    <h1>Year 5: the claim and the hold</h1>
    <p id="power-deck">Loading the assessments…</p>
  </header>

  <aside class="power-legend" aria-label="Legend">
    <div><span class="swatch swatch-claim"></span> Claimed, not held</div>
    <div><span class="swatch swatch-held"></span> <span id="legend-held">Held on the first day</span></div>
    <div><span class="swatch swatch-gain"></span> Passed to Russian control</div>
    <div><span class="swatch swatch-retaken"></span> Passed back to Ukrainian control</div>
  </aside>

  <footer class="power-dock">
    <div class="power-readout">
      <div class="power-date" id="power-date">—</div>
      <div class="power-stats" id="power-stats"></div>
    </div>
    <canvas class="power-spark" id="power-spark" aria-hidden="true"></canvas>
    <div class="power-controls">
      <button type="button" id="power-play" aria-pressed="false">Play</button>
      <input type="range" id="power-slider" min="0" max="1" value="0" aria-label="Date in the weekly series">
    </div>
    <p class="power-credit" id="power-credit"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="../assets/js/power.js"></script>
</body>
</html>
