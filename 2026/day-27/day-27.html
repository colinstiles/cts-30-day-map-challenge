<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 27 — Middle Tennessee-Chickamauga | 30 Day Map Challenge</title>
  <meta name="description" content="USGS hydrologic unit 06020001 as a forge3d terrain model: 3DEP elevation, NHD flowlines, and NHD waterbodies.">
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <script>
    if (new URLSearchParams(location.search).has("embed")) {
      document.documentElement.classList.add("d27-embed");
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #0e0e0a; color: #f2efe4; font-family: Lato, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .d27-bar, .d27-dock {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: none;
      padding: 10px 16px;
      background: #1b1714;
    }
    .d27-bar { border-bottom: 1px solid rgba(242, 239, 228, 0.12); }
    .d27-dock { border-top: 1px solid rgba(242, 239, 228, 0.12); justify-content: space-between; }
    .d27-bar a, .d27-dock a { color: #c4b8a4; font-size: 13px; text-decoration: none; }
    .d27-kicker { color: #9cbb74; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .d27-title { font-weight: 300; font-size: 18px; }
    .d27-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #0e0e0a;
      cursor: grab;
      touch-action: none;
    }
    .d27-stage.is-dragging { cursor: grabbing; }
    .d27-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .d27-readout {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: #f2efe4;
      font-size: 13px;
      text-shadow: 0 1px 2px #0e0e0a;
    }
    button {
      font: inherit;
      color: #f2efe4;
      background: transparent;
      border: 1px solid rgba(242, 239, 228, 0.28);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .d27-credit { margin: 0; color: #b8b5a8; font-size: 12px; line-height: 1.4; }
    html.d27-embed .d27-bar, html.d27-embed .d27-dock { display: none; }
  </style>
</head>
<body>
  <header class="d27-bar">
    <a href="../../index.html">← Gallery</a>
    <span class="d27-kicker">Day 27 · New tool</span>
    <span class="d27-title">Middle Tennessee-Chickamauga</span>
  </header>
  <div class="d27-stage" id="d27-stage">
    <img id="d27-frame" alt="Rotating 3D model of the Middle Tennessee-Chickamauga watershed" src="day-27.png">
    <div class="d27-readout" id="d27-readout">Loading the orbit…</div>
  </div>
  <footer class="d27-dock">
    <div>
      <button type="button" id="d27-play" aria-pressed="true">Pause</button>
    </div>
    <p class="d27-credit">
      HUC 06020001. USGS Watershed Boundary Dataset, 3DEP elevation, and NHD flowlines and waterbodies.
      The vertical scale is exaggerated. Rendered in forge3d.
      <a href="day-27.png">Still frame</a>
    </p>
  </footer>
  <script>
    (function () {
      const stage = document.getElementById("d27-stage");
      const frame = document.getElementById("d27-frame");
      const readout = document.getElementById("d27-readout");
      const play = document.getElementById("d27-play");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let images = [];
      let index = 0;
      let playing = !reduced;
      let visible = true;
      let timer = 0;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function show(next) {
        if (!images.length) return;
        index = (next + images.length) % images.length;
        frame.src = images[index].src;
        readout.textContent = "Drag to turn the basin. Frame " + (index + 1) + " of " + images.length;
      }

      function tick() {
        window.clearInterval(timer);
        if (playing && visible && images.length) {
          timer = window.setInterval(function () { show(index + 1); }, 140);
        }
      }

      play.addEventListener("click", function () {
        playing = !playing;
        play.textContent = playing ? "Pause" : "Play";
        play.setAttribute("aria-pressed", String(playing));
        tick();
      });

      let dragX = null;
      stage.addEventListener("pointerdown", function (event) {
        dragX = event.clientX;
        stage.classList.add("is-dragging");
        stage.setPointerCapture(event.pointerId);
      });
      stage.addEventListener("pointermove", function (event) {
        if (dragX === null) return;
        const step = event.clientX - dragX;
        if (Math.abs(step) < 18) return;
        dragX = event.clientX;
        playing = false;
        play.textContent = "Play";
        play.setAttribute("aria-pressed", "false");
        tick();
        show(index + (step > 0 ? 1 : -1));
      });
      function endDrag() {
        dragX = null;
        stage.classList.remove("is-dragging");
      }
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "cts-embed-visible") return;
        visible = Boolean(event.data.visible);
        tick();
      });

      fetch("orbit.json")
        .then(function (response) { return response.json(); })
        .then(function (orbit) {
          images = Array.from({ length: orbit.frames }, function (_, i) {
            const image = new Image();
            image.src = "frames/frame-" + pad(i) + ".jpg";
            return image;
          });
          if (reduced) {
            play.textContent = "Play";
            play.setAttribute("aria-pressed", "false");
          }
          show(0);
          tick();
        })
        .catch(function () {
          readout.textContent = "The orbit has not been rendered yet.";
        });
    }());
  </script>
</body>
</html>
